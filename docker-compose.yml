name: sirius

services:
  postgres:
    image: postgres:17-alpine
    container_name: sirius-postgres
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius_local
      POSTGRES_DB: sirius
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sirius -d sirius']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
