name: sirius

services:
  postgres:
    image: postgres:17-alpine
    container_name: sirius-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sirius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sirius_local}
      POSTGRES_DB: ${POSTGRES_DB:-sirius}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sirius} -d ${POSTGRES_DB:-sirius}']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sirius-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sirius}:${POSTGRES_PASSWORD:-sirius_local}@postgres:5432/${POSTGRES_DB:-sirius}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
